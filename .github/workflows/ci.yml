name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --include=dev

      # No linter is configured yet (ESLint is not a dependency). When one is added,
      # put `npm run lint` here, before the typecheck.

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run --project unit

      - name: Build
        run: npm run build
